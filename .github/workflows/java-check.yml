name: Java check

# Compiles the app's resources and Java sources only (no native code, no APK, none of the large
# asset downloads), to catch AAPT and javac errors before a full build.
on:
  push:
    branches: [winlator-bionic-glibc]
    paths: [app/src/main/java/**, app/src/main/res/**, app/src/main/AndroidManifest.xml, .github/workflows/java-check.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile resources and Java
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac \
            -x downloadImageFS -x downloadProton -x convertAssetsToZstd -x downloadGlibcRuntime
