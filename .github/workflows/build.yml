name: Android CI Bionic

on:
  push:
    branches: [ "winlator_bionic" ]
  pull_request:
    branches: [ "winlator_bionic" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Rename APK for release
      if: github.event_name != 'pull_request'
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        cp app/build/outputs/apk/debug/app-debug.apk "winlator-bionic-glibc-${SHORT_SHA}.apk"
        echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

    - name: Publish GitHub release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}-${{ env.SHORT_SHA }}
        name: Winlator Bionic + Glibc (build ${{ github.run_number }}, ${{ env.SHORT_SHA }})
        target_commitish: ${{ github.sha }}
        prerelease: true
        body: |
          Automated debug build from branch `${{ github.ref_name }}`, commit ${{ github.sha }}.
          Container runtime can be Bionic or Glibc (Container Settings -> Runtime).
        files: winlator-bionic-glibc-${{ env.SHORT_SHA }}.apk
