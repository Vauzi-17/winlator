import java.net.URL
import java.nio.file.Files
import java.nio.file.Paths
import java.security.MessageDigest
import com.github.luben.zstd.ZstdOutputStream
import org.tukaani.xz.XZInputStream
import org.apache.commons.compress.archivers.tar.TarArchiveInputStream
import com.github.luben.zstd.ZstdInputStream

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
        // Used to recompress the downloaded .txz assets as .tar.zst (much faster to extract on device)
        classpath 'org.tukaani:xz:1.9'
        classpath 'com.github.luben:zstd-jni:1.5.6-3'
        classpath 'org.apache.commons:commons-compress:1.26.2'
    }

}

plugins {
    id 'com.android.application'
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","asset-sources"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.txz")
    String imageFSSHA256Sum = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.sha256sum"
    int parts = 4

    doLast {
        assetDir.mkdirs()
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.txz.%02d", i))
                String partURL = String.format("https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }

        String remoteChecksum = new URL(imageFSSHA256Sum).text.split("\\s+")[0].trim()
        byte[] data = Files.readAllBytes(imageFS.toPath())
        byte[] hash = MessageDigest.getInstance("SHA-256").digest(data)
        String localChecksum = String.format("%064x", new BigInteger(1, hash))

        if (remoteChecksum != localChecksum) {
            println("The version of ImageFS present locally is older than remote or hasn't been downloaded properly, redownloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.txz.%02d", i))
                String partURL = String.format("https://gitlab.com/winlator3/winlator-extra/-/raw/main/imagefs/imagefs.txz.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }
    }
}

tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","asset-sources"].join(File.separator))
    File protonARM64EC = new File(assetDir, "proton-9.0-arm64ec.txz")
    File protonX8664 = new File(assetDir, "proton-9.0-x86_64.txz")
    String protonARM64ECUrl = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-arm64ec.txz"
    String protonARM64ECSHA256Sum = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-arm64ec.txz.sha256sum"
    String protonX8664Url = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-x86_64.txz"
    String protonX8664SHA256Sum = "https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton/proton-9.0-x86_64.txz.sha256sum"

    ext.checkSHA256Sum = { File file ->
        byte[] data = Files.readAllBytes(file.toPath())
        byte[] hash = MessageDigest.getInstance("SHA-256").digest(data)
        return String.format("%064x", new BigInteger(1, hash))
    }

    doLast {
        if (!protonARM64EC.exists()) {
            println("Proton 9.0 ARM64EC was not present, downloading...\n")
            new URL(protonARM64ECUrl).withInputStream { i -> protonARM64EC.withOutputStream { it << i } }
        }
        if (!protonX8664.exists()) {
            println("Proton 9.0 x86_64 was not present, downloading...\n")
            new URL(protonX8664Url).withInputStream { i -> protonX8664.withOutputStream { it << i } }
        }

        String remoteChecksum = new URL(protonARM64ECSHA256Sum).text.split("\\s+")[0].trim()
        byte[] data = Files.readAllBytes(protonARM64EC.toPath())
        byte[] hash = MessageDigest.getInstance("SHA-256").digest(data)
        String localChecksum = String.format("%064x", new BigInteger(1, hash))

        if (remoteChecksum != localChecksum) {
            println("The version of Proton 9.0 ARM64EC present locally is older than remote or hasn't been downloaded properly, redownloading...\n")
            new URL(protonARM64ECUrl).withInputStream { i -> protonARM64EC.withOutputStream { it << i } }
        }

        remoteChecksum = new URL(protonX8664SHA256Sum).text.split("\\s+")[0].trim()
        data = Files.readAllBytes(protonX8664.toPath())
        hash = MessageDigest.getInstance("SHA-256").digest(data)
        localChecksum = String.format("%064x", new BigInteger(1, hash))

        if (remoteChecksum != localChecksum) {
            println("The version of Proton 9.0 x86_64 present locally is older than remote or hasn't been downloaded properly, redownloading...\n")
            new URL(protonX8664Url).withInputStream { i -> protonX8664.withOutputStream { it << i } }
        }
    }
}

// Glibc runtime (optional per-container runtime). Pinned to a specific brunodev85/winlator-app
// commit so the Linux side of the glibc mode is reproducible; files are verified by SHA-256.
tasks.register("downloadGlibcRuntime") {
    def glibcAssetDir = new File(project.rootDir, ["app","src","main","assets","glibc"].join(File.separator))
    File relocateStamp = new File(project.rootDir, ["app","asset-sources","relocate.txt.stamp"].join(File.separator))
    // DXVK 2.4.1 (brunodev85's default) as an extra DXVK version, usable by both runtimes.
    File dxvk241 = new File(project.rootDir, ["app","src","main","assets","dxwrapper","dxvk-2.4.1.tzst"].join(File.separator))
    String dxvk241SHA256 = "897cc48500241006c15c62f200e9a6e1ea8a674bd285da25df6f68fdcdbfe42e"
    String baseUrl = "https://raw.githubusercontent.com/brunodev85/winlator-app/3981d86efa4f333b2a34a7da8b6521476cd8c8b9/app/src/main/assets/"
    def glibcFiles = [
        ["rootfs.tzst", "rootfs.tzst", "aeea2938cc63b0708cb2da999b5a0e3915229b6ab4eac13de061c87f34ffc1dc"],
        ["rootfs_patches.tzst", "rootfs_patches.tzst", "49ab7a5158ef7ccff5ae96dfd539df48483454ed11c0d6788a4f95e0104c864a"],
        ["container_pattern.tzst", "container_pattern.tzst", "8ae3a4fee33e86da26826395650bb07c6f49ce94629ea4b9442bc633b6b8ca33"],
        ["box64/box64-0.4.4.tzst", "box64.tzst", "e1a34fed50bb38ef7fbf51ad5e5b9a76ec4c8178f9cfb4b9f6def0497f2f446c"],
        ["box64/default.box64rc", "default.box64rc", "77fec02b3c8f4bf03420647491e0e21187310ec6ddbc035306d887e79bce2d51"],
        ["graphics_driver/turnip-26.2.0.tzst", "turnip.tzst", "1e5bd643d64b450960ea3208cc96599a4de577f178e9ba0843b1c37083ce50d2"],
        ["graphics_driver/zink-22.2.5.tzst", "zink.tzst", "b9fc365f894a4b837cfd97861972e95c680b5e744691b508f49b9a06d9e3153c"]
    ]

    doLast {
        glibcAssetDir.mkdirs()
        def sha256 = { File f ->
            byte[] hash = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(f.toPath()))
            return String.format("%064x", new BigInteger(1, hash))
        }
        glibcFiles.each { entry ->
            File outFile = new File(glibcAssetDir, entry[1])
            String expected = entry[2]
            if (!outFile.exists() || sha256(outFile) != expected) {
                println("Downloading glibc runtime file " + entry[0] + "...")
                new URL(baseUrl + entry[0]).withInputStream { i -> outFile.withOutputStream { it << i } }
                if (sha256(outFile) != expected) {
                    outFile.delete()
                    throw new GradleException("Checksum mismatch for glibc runtime file " + entry[0])
                }
            }
        }

        if (!dxvk241.exists() || sha256(dxvk241) != dxvk241SHA256) {
            println("Downloading DXVK 2.4.1...")
            new URL(baseUrl + "dxwrapper/dxvk-2.4.1.tzst").withInputStream { i -> dxvk241.withOutputStream { it << i } }
            if (sha256(dxvk241) != dxvk241SHA256) {
                dxvk241.delete()
                throw new GradleException("Checksum mismatch for DXVK 2.4.1")
            }
        }

        // List the files that contain the rootfs prefix, so the device only rewrites those
        // instead of scanning the whole rootfs on install.
        File relocateList = new File(glibcAssetDir, "relocate.txt")
        String listId = glibcFiles.collect { it[2] }.join(",")
        if (!relocateList.exists() || !relocateStamp.exists() || relocateStamp.text != listId) {
            String prefix = "/data/data/com.winlator/files/rootfs"
            def paths = new TreeSet<String>()
            glibcFiles.findAll { it[1].endsWith(".tzst") }.each { entry ->
                new TarArchiveInputStream(new ZstdInputStream(new BufferedInputStream(new FileInputStream(new File(glibcAssetDir, entry[1])), 1 << 20))).withCloseable { tar ->
                    def tarEntry
                    while ((tarEntry = tar.getNextTarEntry()) != null) {
                        if (!tarEntry.isFile()) continue
                        byte[] data = tar.readAllBytes()
                        if (new String(data, "ISO-8859-1").contains(prefix)) paths.add(tarEntry.getName().replaceFirst("^\\./", ""))
                    }
                }
            }
            relocateList.text = paths.join("\n")
            relocateStamp.parentFile.mkdirs()
            relocateStamp.text = listId
            println("glibc relocation list: " + paths.size() + " files")
        }
    }
}

// xz decompresses ~7-8x slower than zstd, which dominated the first launch install time.
// The downloaded .txz files are recompressed once (level 19) and only the .tar.zst ship in the APK.
tasks.register("convertAssetsToZstd") {
    def sourceDir = new File(project.rootDir, ["app","asset-sources"].join(File.separator))
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    def names = ["imagefs", "proton-9.0-x86_64", "proton-9.0-arm64ec"]

    doLast {
        names.each { name ->
            File src = new File(sourceDir, name + ".txz")
            File dst = new File(assetDir, name + ".tar.zst")
            File stamp = new File(sourceDir, name + ".tar.zst.stamp")
            String srcId = src.length() + ":" + src.lastModified()

            // Old builds downloaded the .txz straight into the assets folder.
            new File(assetDir, name + ".txz").delete()

            if (dst.exists() && stamp.exists() && stamp.text == srcId) return

            println("Recompressing " + src.name + " as " + dst.name + "...")
            File tmp = new File(assetDir, dst.name + ".tmp")
            new XZInputStream(new BufferedInputStream(new FileInputStream(src), 1 << 20)).withCloseable { input ->
                def output = new ZstdOutputStream(new BufferedOutputStream(new FileOutputStream(tmp), 1 << 20), 19)
                output.setWorkers(Runtime.getRuntime().availableProcessors())
                output.withCloseable { out ->
                    byte[] buffer = new byte[1 << 20]
                    int read
                    while ((read = input.read(buffer)) != -1) out.write(buffer, 0, read)
                }
            }
            dst.delete()
            if (!tmp.renameTo(dst)) throw new GradleException("Unable to write " + dst)
            stamp.text = srcId
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
downloadProton.dependsOn(downloadImageFS)
convertAssetsToZstd.dependsOn(downloadProton)
preBuild.dependsOn(convertAssetsToZstd)
preBuild.dependsOn(downloadGlibcRuntime)

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 28
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 20
        versionName "7.1.4x-cmod"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        // If you have a release build type, add it here
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    // Already-compressed archives: storing them avoids a second (deflate) decompression on device.
    androidResources {
        noCompress 'zst', 'tzst', 'txz', 'mp3'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.4.0'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
}



